name: TPAY Trading Bot

on:
  schedule:
    # Время указано в часовом поясе Новосибирска (UTC+7).
    # GitHub Actions поддерживает поле timezone.
    - cron: '47 3 * * *'
      timezone: "Asia/Novosibirsk"
  workflow_dispatch: # Кнопка «Run workflow» для ручного теста

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Страховка: задание не будет висеть дольше 10 минут

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run trading bot
        env:
          TBANK_TOKEN: ${{ secrets.TBANK_TOKEN }} # Секрет пробрасывается в переменную окружения
        run: python bot.py
